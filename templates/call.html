<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão – MediaTest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/call.css') }}">
</head>
<body>

<!-- ── Main layout ───────────────────────────────────────────────────────────── -->
<div class="call-wrapper" id="call-wrapper">

    <!-- Video grid -->
    <main class="video-grid" id="video-grid">

        <!-- Local video tile (always present) -->
        <div class="video-tile video-tile--local" id="tile-local">
            <video id="local-video" autoplay muted playsinline></video>
            <span class="video-label" id="local-label">You</span>
        </div>

    </main>

    <!-- Chat side panel -->
    <aside class="chat-panel" id="chat-panel" aria-hidden="true">
        <header class="chat-panel__header">
            <span>Chat</span>
            <button class="chat-close-btn" id="btn-chat-close" title="Close chat">✕</button>
        </header>

        <ul class="chat-messages" id="chat-messages"></ul>

        <form class="chat-input-row" id="chat-form">
            <input
                type="text"
                id="chat-input"
                class="chat-input"
                placeholder="Send a message…"
                autocomplete="off"
            >
            <button type="submit" class="chat-send-btn" title="Send">
                <img src="{{ url_for('static', filename='images/send.svg') }}" alt="Send">
            </button>
        </form>
    </aside>

</div>

<!-- ── Control bar ────────────────────────────────────────────────────────────── -->
<footer class="control-bar">

    <div class="control-bar__info">
        <span id="room-label" class="room-label"></span>
    </div>

    <div class="control-bar__center">
        <button class="control-btn" id="btn-mic" title="Mute microphone">
            <img src="{{ url_for('static', filename='images/audio.svg') }}" alt="Mic">
        </button>

        <button class="control-btn" id="btn-camera" title="Turn camera off">
            <img src="{{ url_for('static', filename='images/video.svg') }}" alt="Camera">
        </button>

        <button class="control-btn control-btn--hangup" id="btn-hangup" title="Leave call">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4
                         1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1
                         1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1
                         1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6
                         3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
            </svg>
        </button>

        <button class="control-btn" id="btn-chat" title="Toggle chat">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0
                         2-.9 2-2V4c0-1.1-.9-2-2-2zm0
                         14H6l-2 2V4h16v12z"/>
            </svg>
        </button>
    </div>

    <div class="control-bar__right">
        <span id="peer-count" class="peer-count">1 participant</span>
    </div>

</footer>


<!-- ── Scripts ────────────────────────────────────────────────────────────────── -->

<!-- Socket.IO client (served by Flask-SocketIO) -->
<script src="{{ url_for('static', filename='scripts/socket.io.min.js') }}"></script>

<!-- WebRTC helpers — load ORDER matters -->
<script src="{{ url_for('static', filename='scripts/user_media.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/data_channel.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/peer_connection.js') }}"></script>

<!-- ── Main call orchestrator ─────────────────────────────────────────────────── -->
<script>
// ── Read URL params ────────────────────────────────────────────────────────────
const params       = new URLSearchParams(window.location.search);
const roomId       = params.get('room_id')   || 'sala-default';
const username     = params.get('username')  || 'Anônimo';
const role         = params.get('role')      || 'guest';
const connType     = params.get('type')      || 'Sala de Aula';

// Will be set after 'joined' event
let userCapabilities = {};

// Map of remote sid → username for display
const peerUsernames = new Map();

document.getElementById('room-label').textContent = roomId;
document.getElementById('local-label').textContent = username;

// ── Socket.IO connection ───────────────────────────────────────────────────────
const socket = io();

socket.on('connect', () => {
    console.log('Socket connected:', socket.id);
    socket.emit('join', {
        username:        username,
        room_id:         roomId,
        role:            role,
        connection_type: connType,
    });
});

socket.on('disconnect', () => {
    console.log('Socket disconnected');
});

// ── Server confirmed our join ──────────────────────────────────────────────────
// The server sends back our capabilities + the list of peers already in the room.
// We call getUserMedia THEN initiate an offer to every existing peer.
socket.on('joined', async (data) => {
    console.log('Joined room. Existing peers:', data.existing_peers);

    // Store our capabilities for use during peer connection setup
    userCapabilities = data.capabilities || {};

    // Capture the usernames of all existing peers so we can display them later
    data.existing_peers.forEach(peer => {
        peerUsernames.set(peer.sid, peer.user);
    });

    await initUserMedia(data.capabilities);

    for (const peer of data.existing_peers) {
        await makeOffer(peer.sid);
    }

    updatePeerCount();
});

// ── A new peer entered the room AFTER us ──────────────────────────────────────
// We do NOT send an offer here — the newcomer will call us.
// We do NOT pre-create the RTCPeerConnection here either: localStream may still
// be null at this point (camera permission not yet granted), which would create
// a trackless connection.  handleOffer() will create it properly with all tracks.
socket.on('peer_joined', (data) => {
    if (data.sid === socket.id) return; // ignore the broadcast about our own join
    console.log('Peer joined:', data.user, data.sid);
    peerUsernames.set(data.sid, data.user);
    updatePeerCount();
});

// ── A peer left ────────────────────────────────────────────────────────────────
socket.on('peer_left', (data) => {
    console.log('Peer left:', data.sid);
    peerUsernames.delete(data.sid);
    closePeerConnection(data.sid);
    updatePeerCount();
});

// ── Signaling relay ────────────────────────────────────────────────────────────
socket.on('receive_offer', async (data) => {
    await handleOffer(data.from_sid, data.sdp);
});

socket.on('receive_answer', async (data) => {
    await handleAnswer(data.from_sid, data.sdp);
});

socket.on('receive_ice_candidate', async (data) => {
    await handleIceCandidate(data.from_sid, data.candidate);
});

// ── Control bar ────────────────────────────────────────────────────────────────
document.getElementById('btn-mic').addEventListener('click', toggleMic);
document.getElementById('btn-camera').addEventListener('click', toggleCamera);

document.getElementById('btn-hangup').addEventListener('click', () => {
    socket.emit('leave', { room_id: roomId, connection_type: connType });
    closeAllPeerConnections();
    stopLocalStream();
    window.location.href = '/home';
});

// ── Chat panel ─────────────────────────────────────────────────────────────────
const chatPanel  = document.getElementById('chat-panel');
const btnChat    = document.getElementById('btn-chat');
const btnClose   = document.getElementById('btn-chat-close');
const chatForm   = document.getElementById('chat-form');
const chatInput  = document.getElementById('chat-input');
const callWrapper = document.getElementById('call-wrapper');

function openChat() {
    chatPanel.setAttribute('aria-hidden', 'false');
    chatPanel.classList.add('chat-panel--open');
    callWrapper.classList.add('call-wrapper--chat-open');
}

function closeChat() {
    chatPanel.setAttribute('aria-hidden', 'true');
    chatPanel.classList.remove('chat-panel--open');
    callWrapper.classList.remove('call-wrapper--chat-open');
}

btnChat.addEventListener('click', () => {
    chatPanel.classList.contains('chat-panel--open') ? closeChat() : openChat();
});
btnClose.addEventListener('click', closeChat);

chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (text) {
        sendMessage(text);
        chatInput.value = '';
    }
});

// ── Peer counter ───────────────────────────────────────────────────────────────
function updatePeerCount() {
    const n = peerConnections.size + 1; // +1 for ourselves
    const el = document.getElementById('peer-count');
    if (el) el.textContent = `${n} participant${n !== 1 ? 's' : ''}`;
}
</script>

</body>
</html>
